<!doctype html>
<html lang="zh-CN" data-skin="studio" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111214">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>文案审核台 · Studio</title>
  <link rel="icon" href="assets/app-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skins/apple.css">
  <link rel="stylesheet" href="skins/studio.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="studio-shell" id="shell" aria-label="文案审核台 Studio">
    <aside class="studio-sidebar" id="studioSidebar" aria-label="工作区导航">
      <header class="side-header">
        <button class="collapse-button" id="collapseSidebar" aria-label="收起侧边栏" aria-controls="studioSidebar" title="收起侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      </header>
      <button class="side-command" id="openCommand" title="搜索项目或文档 · ⌘ K" aria-label="搜索项目或文档"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v10a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V7Z"/></svg><span>搜索</span><kbd>⌘ K</kbd></button>
      <nav class="side-tree" id="sideTree" aria-label="当前分组"></nav>
    </aside>

    <section class="workspace-pane">
      <header class="workspace-header">
        <button class="side-reveal" id="revealSidebar" aria-label="展开侧边栏" aria-controls="studioSidebar" title="展开侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 7 5 5-5 5M5 4h14v16H5z"/></svg></button>
        <div class="breadcrumb" id="breadcrumb"><b>总览</b></div>
      </header>
      <div id="viewRoot" class="view-root"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="icon-button" id="closeDialog" aria-label="关闭弹窗">×</button></div><div id="dialogBody"></div></dialog>
  <input id="fileInput" type="file" accept=".txt,.md,.csv,.json" multiple hidden>
</body>
</html>

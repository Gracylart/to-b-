<!doctype html>
<html lang="zh-CN" data-skin="apple" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#343638">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>文案审核台 · Review Desk</title>
  <link rel="icon" href="assets/app-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skins/apple.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="preview-brand" aria-hidden="true"><span class="brand-matrix"><i></i><i></i><i></i><i></i></span> REVIEW DESK <span>文案审核台</span></div>
  <main class="glass-shell" id="shell" aria-label="文案审核台">
    <header class="shell-header">
      <nav class="view-tabs" aria-label="主导航">
        <button data-view="home" aria-current="page">TOTAL</button>
        <button data-view="project">PROJECT</button>
        <button data-view="review">REVIEW <span id="reviewDot" class="tab-dot" hidden></span></button>
      </nav>
      <div class="header-tools"><button class="icon-button pin-button" id="pinWindow" aria-label="固定窗口" aria-pressed="false" title="固定窗口">⌖</button><button class="icon-button" id="openSettings" aria-label="设置"><img src="assets/figma/a-icon-settings.svg" alt=""></button></div>
    </header>
    <div id="viewRoot" class="view-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <div class="preview-caption">A / 总览 <span>·</span> B / 项目 <span>·</span> C / 审核</div>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="icon-button" id="closeDialog" aria-label="关闭弹窗">×</button></div><div id="dialogBody"></div></dialog>
  <input id="fileInput" type="file" accept=".txt,.md,.csv,.json" multiple hidden>
</body>
</html>
